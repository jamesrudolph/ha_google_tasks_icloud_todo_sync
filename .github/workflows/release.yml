name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 or 1.2.3-beta.1 (tag v<version> is created)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version and build zip
        env:
          DOMAIN: ha_google_tasks_icloud_todo_sync
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+.*$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          MANIFEST="custom_components/${DOMAIN}/manifest.json"
          test -f "$MANIFEST" || { echo "Missing $MANIFEST"; exit 1; }
          python3 - "$MANIFEST" "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1:3]
          with open(path) as f:
              data = json.load(f)
          data["version"] = version
          with open(path, "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          cd "custom_components/${DOMAIN}"
          zip -r "${GITHUB_WORKSPACE}/${DOMAIN}.zip" . -x "*__pycache__*"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ha_google_tasks_icloud_todo_sync.zip
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
